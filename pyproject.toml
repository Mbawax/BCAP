[project]
name = "campaign-analytics-platform"
version = "0.1.0"
description = "Reusable analytics platform for vaccination campaigns"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40,<2.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<7.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
